<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>فيديو النصر - 2</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Changa", sans-serif;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        .video-wrapper {
            width: 70%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .video-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(180, 0, 0, 0.5);
            border: 2px solid darkred;
            background: #111;
        }

        video {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            display: block;
        }

        .controls-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stop-btn {
            background: darkred;
            color: white;
            border: none;
            padding: 10px 30px;
            font-family: "Changa", sans-serif;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .stop-btn:hover {
            background: #a00000;
            box-shadow: 0 6px 30px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid darkred;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .overlay-msg {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            z-index: 999;
            text-align: center;
            flex-direction: column;
            gap: 15px;
        }

        .overlay-msg.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div class="video-container">
            <video id="mainVideo" autoplay controls>
                <source src="WhatsApp Video 2026-10-06 at 5.47.11 PM.mp4" type="video/mp4">
            </video>
        </div>

        <div class="controls-box">
            <button class="stop-btn" id="stopBtn">إيقاف الفيديو</button>
        </div>
    </div>

    <div class="overlay-msg" id="overlayMsg">
        <div class="spinner"></div>
        <p>جاري الانتقال...</p>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const stopBtn = document.getElementById('stopBtn');
        const overlayMsg = document.getElementById('overlayMsg');

        stopBtn.addEventListener('click', function () {
            if (video.paused) {
                video.play();
                stopBtn.textContent = 'إيقاف الفيديو';
            } else {
                video.pause();
                stopBtn.textContent = 'تشغيل الفيديو';
            }
        });

        video.addEventListener('ended', function () {
            overlayMsg.classList.add('show');
            setTimeout(function () {
                window.location.href = 'credits.html';
            }, 1500);
        });
    </script>

</body>
</html>
