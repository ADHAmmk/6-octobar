<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>المبرمج</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Changa", sans-serif;
            background: #050505;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: white;
        }

        /* خلفية متحركة */
        .bg-glow {
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(139,0,0,0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-bg 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-bottom {
            position: fixed;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(180,0,0,0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-bg 4s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse-bg {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }

        /* الجسيمات */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: darkred;
            border-radius: 50%;
            animation: float-particle linear infinite;
            opacity: 0;
        }

        @keyframes float-particle {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 0.7; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* المحتوى الرئيسي */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
            text-align: center;
        }

        /* الشارة العلوية */
        .badge {
            font-size: 13px;
            font-weight: 700;
            color: #aaa;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeDown 0.8s ease forwards;
            opacity: 0;
        }

        /* البطاقة الرئيسية */
        .main-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(139,0,0,0.6);
            border-radius: 24px;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            box-shadow:
                0 0 0 1px rgba(139,0,0,0.1),
                0 0 40px rgba(139,0,0,0.2),
                0 0 80px rgba(139,0,0,0.1),
                inset 0 0 40px rgba(139,0,0,0.05);
            animation: scaleIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            opacity: 0;
            transform: scale(0.8);
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, darkred, transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            to { left: 100%; }
        }

        /* أيقونة الكمبيوتر */
        .icon-circle {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #8b0000, #3a0000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 30px rgba(139,0,0,0.5), 0 0 60px rgba(139,0,0,0.2);
            animation: icon-glow 2s ease-in-out infinite alternate;
        }

        @keyframes icon-glow {
            from { box-shadow: 0 0 20px rgba(139,0,0,0.5), 0 0 40px rgba(139,0,0,0.2); }
            to   { box-shadow: 0 0 40px rgba(200,0,0,0.7), 0 0 80px rgba(200,0,0,0.3); }
        }

        .role-label {
            font-size: 13px;
            color: #888;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .divider-line {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, darkred, transparent);
        }

        .programmer-title {
            font-size: 14px;
            color: darkred;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .programmer-name {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
            text-shadow: 0 0 20px rgba(200,0,0,0.4);
        }

        .programmer-name span {
            color: darkred;
        }

        /* زرار إلغاء العرض */
        .exit-btn {
            position: relative;
            padding: 14px 50px;
            font-family: "Changa", sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: white;
            background: transparent;
            border: 2px solid darkred;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 1px;
            overflow: hidden;
            animation: fadeUp 1s ease 0.8s forwards;
            opacity: 0;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .exit-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: darkred;
            transition: left 0.4s ease;
            z-index: -1;
        }

        .exit-btn:hover::before {
            left: 0;
        }

        .exit-btn:hover {
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(180,0,0,0.5);
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- خلفية متوهجة -->
    <div class="bg-glow"></div>
    <div class="bg-glow-bottom"></div>

    <!-- جسيمات عائمة -->
    <div class="particles" id="particles"></div>

    <!-- المحتوى -->
    <div class="content">

        <p class="badge">✦ &nbsp; تطوير وبرمجة &nbsp; ✦</p>

        <div class="main-card">
            <div class="icon-circle">💻</div>
            <p class="role-label">DEVELOPER</p>
            <div class="divider-line"></div>
            <p class="programmer-title">المبرمج</p>
            <p class="programmer-name">البشمهندس<br><span>ادهم محمد ابراهيم</span></p>
        </div>

        <button class="exit-btn" onclick="window.location.href='index.html'">
            ✕ &nbsp; إلغاء العرض
        </button>

    </div>

    <script>
        // توليد الجسيمات
        const container = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
            p.style.animationDuration = (Math.random() * 8 + 6) + 's';
            p.style.animationDelay = (Math.random() * 6) + 's';
            container.appendChild(p);
        }
    </script>

</body>
</html>
